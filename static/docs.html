<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AirSense AI - Tài Liệu API & Swagger UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .top-header {
      background: #1e293b;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: #38bdf8;
    }
    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid #334155;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: #38bdf8;
      color: #0f172a;
    }
    .swagger-container-wrap {
      max-width: 1280px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .swagger-ui .topbar { display: none; }
    .swagger-ui {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="top-header">
    <div class="brand-title">
      <i class="fa-solid fa-cloud-bolt"></i>
      <span>AirSense AI – Tài Liệu API Khí Tượng & Dự Báo (Swagger UI)</span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <a href="openapi.json" target="_blank" class="back-btn" title="Tải OpenAPI Schema JSON">
        <i class="fa-solid fa-file-code"></i> OpenAPI JSON
      </a>
      <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Quay lại Web App
      </a>
    </div>
  </div>

  <div class="swagger-container-wrap">
    <div id="swagger-ui"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      SwaggerUIBundle({
        url: "openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
